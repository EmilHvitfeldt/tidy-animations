project:
  type: website
  # render into docs/ so GitHub Pages can serve from the main branch /docs folder
  output-dir: docs
  # regenerate the reusable bundles from the current js/ + css/ before each build
  pre-render: tools/make_bundle.py --all
  # ship the GIF/MP4 captures and reusable bundles alongside the rendered decks
  resources:
    - gifs/
    - mp4/
    - bundles/
    # keep .nojekyll in docs/ so GitHub Pages serves the site_libs/ assets verbatim
    - .nojekyll

website:
  title: "tidymodels, animated"

format:
  revealjs:
    theme: [default, css/demos.css]
    width: 1280
    height: 720
    transition: fade
    controls: true
    progress: true
    hash: true
    # anime.js is shared by every animation deck
    include-in-header:
      text: |
        <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
    # shared infrastructure (coord conversion, fragment gating) loads everywhere;
    # each deck adds its own animation module via its own `include-after-body`.
    include-after-body:
      - js/infra.html
