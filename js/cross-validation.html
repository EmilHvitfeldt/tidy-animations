<script>
/* ---- Cross-validation animation ----
 * Marker slide: .cv-slide   Stage container: #cv-stage
 * render(stage) is idempotent (stage = number of visible gating fragments).
 */
(function () {
  const COLS = 6, ROWS = 5, N = COLS * ROWS;   // 30 points
  const BOX = 56, GAP = 14;
  const START_X = 40;                          // left-hand side
  const GRID_H = ROWS * BOX + (ROWS - 1) * GAP;
  const START_Y = (520 - GRID_H) / 2;          // vertically centred in the stage

  // Colours are configurable from the .qmd via `window.CV_COLORS` (one per fold).
  const COLORS = window.CV_COLORS || ['#8ecae6', '#90be6d', '#f9c74f'];

  // Hardcoded colour assignment: rolled the dice once. Looks scattered, but is
  // exactly balanced — ten boxes of each colour (10/10/10). Row-major, 6 per row.
  const ASSIGN = [
    1, 1, 2, 0, 2, 0,
    0, 2, 1, 2, 1, 1,
    2, 0, 0, 1, 0, 2,
    1, 2, 1, 0, 2, 0,
    2, 0, 1, 2, 1, 0,
  ];

  // transparent version of a hex colour, so the fill fades in within its own
  // hue instead of passing through grey (transparent-black) on the way up
  function fade(hex) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, 0)`;
  }

  // right-hand split grids
  const RIGHT_X = 640;
  const ANALYSIS  = { x: RIGHT_X, y: 40,  cols: 5, n: 20, label: 'Analysis',   labelY: 0   };
  const ASSESS    = { x: RIGHT_X, y: 370, cols: 5, n: 10, label: 'Assessment', labelY: 330 };

  let boxes = [];          // the 30 source points on the left
  let rightBoxes = [];     // analysis + assessment grids (empty outline targets)
  let rightLabels = [];
  let clones = [];         // copies that fly from the left into the right grids
  let placedFold = 0;      // which fold's copies are currently shown (0 = none)

  function cellXY(i) {
    const c = i % COLS, r = Math.floor(i / COLS);
    return { x: START_X + c * (BOX + GAP), y: START_Y + r * (BOX + GAP) };
  }
  function slotXY(spec, i) {
    const c = i % spec.cols, r = Math.floor(i / spec.cols);
    return { x: spec.x + c * (BOX + GAP), y: spec.y + r * (BOX + GAP) };
  }
  function colorOf(i) { return COLORS[ASSIGN[i]]; }

  function buildGrid(stage, spec) {
    for (let i = 0; i < spec.n; i++) {
      const c = i % spec.cols, r = Math.floor(i / spec.cols);
      const b = document.createElement('div');
      b.className = 'cv-box';
      b.style.opacity = 0;
      b.style.transform = `translate(${spec.x + c * (BOX + GAP)}px, ${spec.y + r * (BOX + GAP)}px)`;
      stage.appendChild(b);
      rightBoxes.push(b);
    }
    const lab = document.createElement('div');
    lab.className = 'cv-label';
    lab.textContent = spec.label;
    lab.style.opacity = 0;
    lab.style.transform = `translate(${spec.x}px, ${spec.labelY}px)`;
    stage.appendChild(lab);
    rightLabels.push(lab);
  }

  function build() {
    const stage = document.getElementById('cv-stage');
    if (!stage || boxes.length) return !!stage;
    for (let i = 0; i < N; i++) {
      const b = document.createElement('div');
      b.className = 'cv-box';
      b.textContent = i + 1;          // number the source points 1..30
      const { x, y } = cellXY(i);
      b.style.transform = `translate(${x}px, ${y}px)`;
      stage.appendChild(b);
      boxes.push(b);
    }
    buildGrid(stage, ANALYSIS);
    buildGrid(stage, ASSESS);
    return true;
  }

  function render(stage) {
    if (!build()) return;
    // stage 0: bare grid   |   stage 1: each box filled, 1/3 per colour
    const filled = stage >= 1;
    boxes.forEach((b, i) => {
      const c = colorOf(i);
      anime({
        targets: b,
        backgroundColor: filled ? c : fade(c),
        duration: 500,
        easing: 'easeInOutQuad',
        delay: filled ? anime.stagger(20) : 0,
      });
    });

    // stage 2: reveal the analysis (20) and assessment (10) grids on the right
    const shown = stage >= 2;
    anime({
      targets: [...rightBoxes, ...rightLabels],
      opacity: shown ? 1 : 0,
      duration: 400,
      easing: 'easeInOutQuad',
      delay: shown ? anime.stagger(15) : 0,
    });

    // stages 3+: one iteration per fold. Fold f holds out colour (f-1) as the
    // assessment set; the other two colours form the analysis set.
    const title = document.getElementById('cv-title');
    if (stage >= 3) {
      const fold = stage - 2;            // stage 3 -> fold 1, stage 4 -> fold 2, ...
      if (title) {
        title.textContent = `Fold ${fold} Iteration`;
        anime({ targets: title, opacity: 1, duration: 400, easing: 'easeInOutQuad' });
      }
      ensureFold(fold);
    } else {
      if (title) anime({ targets: title, opacity: 0, duration: 400, easing: 'easeInOutQuad' });
      placedFold = 0;
      clearClones();
    }
  }

  // Place the right-hand copies for a fold, swapping out the previous fold's
  // copies first (they disappear, then the new pattern flies in).
  function ensureFold(fold) {
    if (placedFold === fold) return;       // already showing this fold — stay stable
    placedFold = fold;
    const assessColor = fold - 1;
    // pause after the old copies vanish before the new colour flies in
    if (clones.length) clearClones(() => setTimeout(() => placeClones(assessColor), 350));
    else placeClones(assessColor);
  }

  function placeClones(assessColor) {
    if (clones.length) return;
    const stage = document.getElementById('cv-stage');
    const assessIdx = [], analysisIdx = [];
    for (let i = 0; i < N; i++) (ASSIGN[i] === assessColor ? assessIdx : analysisIdx).push(i);

    function fly(idx, dest, order) {
      const s = cellXY(idx);
      const b = document.createElement('div');
      b.className = 'cv-box';
      b.textContent = idx + 1;
      b.style.backgroundColor = colorOf(idx);
      stage.appendChild(b);
      clones.push(b);
      anime.set(b, { translateX: s.x, translateY: s.y });
      anime({
        targets: b,
        translateX: dest.x,
        translateY: dest.y,
        duration: 750,
        easing: 'easeInOutCubic',
        delay: order * 40,
      });
    }

    assessIdx.forEach((idx, k) => fly(idx, slotXY(ASSESS, k), k));
    analysisIdx.forEach((idx, j) => fly(idx, slotXY(ANALYSIS, j), j));
  }

  function clearClones(cb) {
    if (!clones.length) { if (cb) cb(); return; }
    const dying = clones;
    clones = [];
    anime({
      targets: dying,
      opacity: 0,
      duration: 250,
      easing: 'easeInOutQuad',
      complete: () => { dying.forEach(b => b.remove()); if (cb) cb(); },
    });
  }

  TM.gate({
    markerClass: 'cv-slide',
    fragmentIds: ['cv-color', 'cv-split', 'cv-fold1', 'cv-fold2', 'cv-fold3'],
    render,
  });
})();
</script>
