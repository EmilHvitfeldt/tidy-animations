<script>
/* ---- Cross-validation animation ----
 * Marker slide: .cv-slide   Stage container: #cv-stage
 * render(stage) is idempotent (stage = number of visible gating fragments).
 */
(function () {
  const K = 3;                                 // Explicitly set k = 3
  const COLS = 6, ROWS = 5, N = COLS * ROWS;   // 30 points
  const BOX = 56, GAP = 14;
  const START_X = 40;                          // left-hand side
  const GRID_H = ROWS * BOX + (ROWS - 1) * GAP;
  const START_Y = (520 - GRID_H) / 2;          // vertically centred in the stage

  // Colours are configurable from the .qmd via `window.CV_COLORS` (one per fold).
  const COLORS = window.CV_COLORS || ['#6aa9e0', '#6cbf84', '#e8853a'];

  // Hardcoded colour assignment: balanced — ten boxes of each colour (10/10/10).
  const ASSIGN = [
    1, 1, 2, 0, 2, 0,
    0, 2, 1, 2, 1, 1,
    2, 0, 0, 1, 0, 2,
    1, 2, 1, 0, 2, 0,
    2, 0, 1, 2, 1, 0,
  ];

  let r2Scores = [];

  function fade(hex) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, 0)`;
  }

  // right-hand split grids
  const RIGHT_X = 640;
  const ANALYSIS  = { x: RIGHT_X, y: 40,  cols: 5, n: 20, label: 'Analysis',   labelY: 0   };
  const ASSESS    = { x: RIGHT_X, y: 370, cols: 5, n: 10, label: 'Assessment', labelY: 330 };

  let boxes = [];          
  let rightBoxes = [];     
  let rightLabels = [];
  let clones = [];         
  let placedFold = 0;      

  function cellXY(i) {
    const c = i % COLS, r = Math.floor(i / COLS);
    return { x: START_X + c * (BOX + GAP), y: START_Y + r * (BOX + GAP) };
  }
  function slotXY(spec, i) {
    const c = i % spec.cols, r = Math.floor(i / spec.cols);
    return { x: spec.x + c * (BOX + GAP), y: spec.y + r * (BOX + GAP) };
  }
  function colorOf(i) { return COLORS[ASSIGN[i]]; }

  function buildGrid(stage, spec) {
    for (let i = 0; i < spec.n; i++) {
      const c = i % spec.cols, r = Math.floor(i / spec.cols);
      const b = document.createElement('div');
      b.className = 'cv-box';
      b.style.opacity = 0;
      b.style.transform = `translate(${spec.x + c * (BOX + GAP)}px, ${spec.y + r * (BOX + GAP)}px)`;
      stage.appendChild(b);
      rightBoxes.push(b);
    }
    const lab = document.createElement('div');
    lab.className = 'cv-label';
    lab.textContent = spec.label;
    lab.style.opacity = 0;
    lab.style.transform = `translate(${spec.x}px, ${spec.labelY}px)`;
    stage.appendChild(lab);
    rightLabels.push(lab);
  }

  // Safe programmatic builder injection for equation display layout container
  function getOrCreateEquationElement(stage) {
    let eqBox = document.getElementById('cv-equation-output');
    if (!eqBox) {
      eqBox = document.createElement('div');
      eqBox.id = 'cv-equation-output';
      eqBox.style.position = 'absolute';
      eqBox.style.bottom = '-50px';
      eqBox.style.left = '50%';
      eqBox.style.transform = 'translateX(-50%)';
      eqBox.style.fontSize = '26px';
      eqBox.style.fontWeight = '600';
      eqBox.style.color = 'var(--tm-ink)';
      eqBox.style.opacity = '0';
      eqBox.style.whiteSpace = 'nowrap';
      stage.appendChild(eqBox);
    }
    return eqBox;
  }

  function build() {
    const stage = document.getElementById('cv-stage');
    if (!stage || boxes.length) return !!stage;
    for (let i = 0; i < N; i++) {
      const b = document.createElement('div');
      b.className = 'cv-box';
      b.textContent = i + 1;          
      const { x, y } = cellXY(i);
      b.style.transform = `translate(${x}px, ${y}px)`;
      stage.appendChild(b);
      boxes.push(b);
    }
    buildGrid(stage, ANALYSIS);
    buildGrid(stage, ASSESS);
    getOrCreateEquationElement(stage);
    return true;
  }

  // Dynamic helper function to perform smooth opacity text transitions
  function animateTextTransition(element, newText) {
    if (!element || element.textContent === newText) return;
    TM.anime({
      targets: element,
      opacity: 0,
      duration: 180,
      easing: 'easeInOutQuad',
      complete: () => {
        element.textContent = newText;
        TM.anime({
          targets: element,
          opacity: 1,
          duration: 250,
          easing: 'easeInOutQuad'
        });
      }
    });
  }

  function render(stage) {
    if (!build()) return;
    const title = document.getElementById('cv-title');
    const stageEl = document.getElementById('cv-stage');
    const eqBox = getOrCreateEquationElement(stageEl);

    // Color validation flag controls (Stage 0 and 1 remain bare)
    const filled = stage >= 2;

    // Stage Engine Pipeline Updates
    if (title) {
      if (stage === 0) {
        animateTextTransition(title, "Unsplit Original Dataset");
        TM.anime({ targets: title, opacity: 1, duration: 400 });
        TM.anime({ targets: eqBox, opacity: 0, duration: 200 });
      } else if (stage === 1) {
        animateTextTransition(title, "Choose 3 Folds");
        TM.anime({ targets: eqBox, opacity: 0, duration: 200 });
      } else if (stage === 2) {
        animateTextTransition(title, `Data Assigned to ${K} Distinct Folds`);
        TM.anime({ targets: eqBox, opacity: 0, duration: 200 });
      } else if (stage === 3) {
        animateTextTransition(title, "Split Data into Analysis & Assessment Components");
        TM.anime({ targets: eqBox, opacity: 0, duration: 200 });
      }
    }

    // Smooth color fill interpolation animation rules
    boxes.forEach((b, i) => {
      const c = colorOf(i);
      TM.anime({
        targets: b,
        backgroundColor: filled ? c : fade(c),
        duration: 500,
        easing: 'easeInOutQuad',
        delay: filled ? anime.stagger(15) : 0,
      });
    });

    // Reveal split training layouts on right flank
    const shown = stage >= 3;
    TM.anime({
      targets: [...rightBoxes, ...rightLabels],
      opacity: shown ? 1 : 0,
      duration: 400,
      easing: 'easeInOutQuad',
      delay: shown ? anime.stagger(10) : 0,
    });

    // Handle interactive fold computation logic steps (Stages 4, 5, 6)
    if (stage >= 4) {
      const fold = stage - 3;            // Adjust alignment offset maps
      
      if (!r2Scores[fold - 1]) {
        r2Scores[fold - 1] = parseFloat((0.76 + Math.random() * 0.12).toFixed(3));
      }

      if (title) {
        animateTextTransition(title, `Fold ${fold} Iteration (k=${K})`);
      }

      // Generate bottom equation layouts based on completed loop cycles
      if (eqBox) {
        let formulaText = `Fold Metrics: R²₁ = ${r2Scores[0] || '?'}`;
        if (fold >= 2) formulaText += `, R²₂ = ${r2Scores[1] || '?'}`;
        if (fold >= 3) formulaText += `, R²₃ = ${r2Scores[2] || '?'}`;

        if (fold === K) {
          const avgR2 = (r2Scores.reduce((sum, val) => sum + val, 0) / K).toFixed(3);
          formulaText += `  |  Mean R² = (R²₁ + R²₂ + R²₃) / 3 = ${avgR2}`;
        }
        
        animateTextTransition(eqBox, formulaText);
      }
      ensureFold(fold);
    } else if (stage < 4 && stage > 0) {
      placedFold = 0;
      r2Scores = []; 
      clearClones();
    } else if (stage === 0) {
      placedFold = 0;
      r2Scores = [];
      clearClones();
    }
  }

  function ensureFold(fold) {
    if (placedFold === fold) return;       
    placedFold = fold;
    const assessColor = fold - 1;
    if (clones.length) clearClones(() => TM.pause(350, () => placeClones(assessColor)));
    else placeClones(assessColor);
  }

  function placeClones(assessColor) {
    if (clones.length) return;
    const stage = document.getElementById('cv-stage');
    const assessIdx = [], analysisIdx = [];
    for (let i = 0; i < N; i++) (ASSIGN[i] === assessColor ? assessIdx : analysisIdx).push(i);

    function fly(idx, dest, order) {
      const s = cellXY(idx);
      const b = document.createElement('div');
      b.className = 'cv-box';
      b.textContent = idx + 1;
      b.style.backgroundColor = colorOf(idx);
      stage.appendChild(b);
      clones.push(b);
      anime.set(b, { translateX: s.x, translateY: s.y });
      TM.anime({
        targets: b,
        translateX: dest.x,
        translateY: dest.y,
        duration: 750,
        easing: 'easeInOutCubic',
        delay: order * 30,
      });
    }

    assessIdx.forEach((idx, k) => fly(idx, slotXY(ASSESS, k), k));
    analysisIdx.forEach((idx, j) => fly(idx, slotXY(ANALYSIS, j), j));
  }

  function clearClones(cb) {
    if (!clones.length) { if (cb) cb(); return; }
    const dying = clones;
    clones = [];
    TM.anime({
      targets: dying,
      opacity: 0,
      duration: 250,
      easing: 'easeInOutQuad',
      complete: () => { dying.forEach(b => b.remove()); if (cb) cb(); },
    });
  }

  TM.gate({
    markerClass: 'cv-slide',
    fragmentIds: ['cv-choose', 'cv-color', 'cv-split', 'cv-fold1', 'cv-fold2', 'cv-fold3'],
    render,
  });
})();
</script>
