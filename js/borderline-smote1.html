<script>
/* ---- Borderline-SMOTE1 animation ----
 * Marker slide: .bl1-slide   Stage container: #bl1-stage
 * render(stage) is idempotent (stage = number of visible gating fragments).
 *
 * Segments (stage 0 = slide arrival):
 *   0 imbalanced data
 *   1 look at a minority point's m nearest neighbours (both classes)
 *   2 classify every minority point SAFE / DANGER / NOISE
 *   3 keep only the DANGER (borderline) points  (+ zoom in)
 *   4 synthesise from a DANGER point along a line to a minority neighbour
 *   5 repeat across the border -> balanced  (+ zoom out)
 */
(function () {
  const W = 1100, H = 560;

  // [majority, minority/SAFE, synthetic, DANGER, NOISE].
  const COLORS = window.BL1_COLORS || ['#c8ccd4', '#d6336c', '#e59db7', '#f76707', '#868e96'];
  const [C_MAJ, C_MIN, C_SYN, C_DANGER, C_NOISE] = COLORS;

  // Hardcoded coordinates (rolled once, verified with a classifier) — stable.
  const MAJ = [
    [90,80],[70,320],[130,480],[220,150],[260,430],[300,70],
    [520,180],[600,170],[690,180],[770,200],
    [520,400],[600,410],[690,410],[770,390],
    [500,300],[820,300],
    [880,110],[900,300],[880,480],[960,190],[960,400],
    [1010,110],[1020,300],[1010,490],[1050,200],[1050,380],
    [900,240],[900,360],[1000,300],
    [150,540],[350,540],[520,540],[690,540],[930,540],
    [400,120],[400,470],[830,150],[830,450],[720,300],
    [600,375],[650,205],[625,290],[675,285],
  ];
  const MIN = [
    [280,280],[320,300],[290,340],[350,270],[310,360],[360,330],   // 0-5  SAFE cluster
    [560,250],[600,320],[650,260],[700,330],[740,270],             // 6-10 DANGER arc
    [960,300],                                                     // 11   NOISE
  ];

  const M = 5;                 // neighbourhood size for classification (both classes)
  const K = 5;                 // minority neighbours per point for interpolation
  const DEMO = 8;              // minority point whose neighbourhood we show in stage 1
  const SYNTH_SRC = 7;         // DANGER point we synthesise from in stage 4
  const PICK = 0;              // which minority-neighbour (by rank) we interpolate along
  const LAMBDA = 0.5;          // fraction along that segment for the new point

  // Zoom onto the borderline arc during stages 3-4, out again for stage 5.
  const CLUSTER = [650, 288];
  const CENTER = [560, 280];
  const ZOOM = 1.7;

  // ---- combined-set helpers (majority then minority in one index space) ----
  const NALL = MAJ.length + MIN.length;
  function pt(gi) { return gi < MAJ.length ? MAJ[gi] : MIN[gi - MAJ.length]; }
  function isMaj(gi) { return gi < MAJ.length; }

  // m nearest neighbours of minority point `mi` across ALL points.
  function mnn(mi, m) {
    const self = MAJ.length + mi, [sx, sy] = MIN[mi];
    const out = [];
    for (let gi = 0; gi < NALL; gi++) {
      if (gi === self) continue;
      const [x, y] = pt(gi);
      out.push({ gi, maj: isMaj(gi), d: (x - sx) ** 2 + (y - sy) ** 2 });
    }
    return out.sort((a, b) => a.d - b.d).slice(0, m);
  }
  // classify every minority point by its m-neighbourhood.
  function classify() {
    return MIN.map((_, mi) => {
      const majN = mnn(mi, M).filter(o => o.maj).length;
      return majN < M / 2 ? 'SAFE' : (majN === M ? 'NOISE' : 'DANGER');
    });
  }
  const LABEL = classify();
  const DANGER_IDX = LABEL.map((l, i) => l === 'DANGER' ? i : -1).filter(i => i >= 0);

  // k nearest MINORITY neighbours (indices into MIN).
  function knnMin(src, k) {
    const [sx, sy] = MIN[src];
    return MIN.map(([x, y], i) => ({ i, d: (x - sx) ** 2 + (y - sy) ** 2 }))
      .filter(o => o.i !== src).sort((a, b) => a.d - b.d).slice(0, k).map(o => o.i);
  }
  function colorFor(mi) {
    return LABEL[mi] === 'DANGER' ? C_DANGER : LABEL[mi] === 'NOISE' ? C_NOISE : C_MIN;
  }

  // Stage-5 synthetic specs: for each danger point, two points toward its two
  // nearest minority neighbours. Hardcoded-derived, so stable.
  const SYNTH_SPECS = [];
  DANGER_IDX.forEach(d => {
    const nb = knnMin(d, 2);
    SYNTH_SPECS.push([d, nb[0], 0.4], [d, nb[1], 0.6]);
  });

  let built = false, world = null;
  let majDots = [], minDots = [], legend = null;

  // stage-1 neighbourhood scaffold
  let ring = null, nbrLines = [], nbrShown = false;
  // stage-4 synthesis scaffold
  let knnLines = [], synthDot = null, synth4Shown = false;
  // stage-5 extra synthetic points
  let extra = [], extraShown = false;

  function makeDot(x, y, color, animated) {
    const d = document.createElement('div');
    d.className = 'bl1-dot';
    d.style.backgroundColor = color;
    world.appendChild(d);
    if (animated) anime.set(d, { translateX: x, translateY: y });
    else d.style.transform = `translate(${x}px, ${y}px)`;
    return d;
  }

  function build() {
    const stage = document.getElementById('bl1-stage');
    if (!stage || built) return !!stage;
    built = true;
    world = document.createElement('div');
    world.className = 'bl1-world';
    stage.appendChild(world);
    MAJ.forEach(([x, y]) => majDots.push(makeDot(x, y, C_MAJ, false)));
    MIN.forEach(([x, y]) => minDots.push(makeDot(x, y, C_MIN, true)));

    // legend lives on the (unzoomed) stage, not the world group
    legend = document.createElement('div');
    legend.className = 'bl1-legend';
    legend.innerHTML =
      `<span class="chip"><span class="swatch" style="background:${C_MIN}"></span>SAFE</span>` +
      `<span class="chip"><span class="swatch" style="background:${C_DANGER}"></span>DANGER</span>` +
      `<span class="chip"><span class="swatch" style="background:${C_NOISE}"></span>NOISE</span>`;
    stage.appendChild(legend);
    return true;
  }

  function zoom(on) {
    const s = on ? ZOOM : 1;
    TM.anime({
      targets: world,
      translateX: on ? CENTER[0] - s * CLUSTER[0] : 0,
      translateY: on ? CENTER[1] - s * CLUSTER[1] : 0,
      scale: s, duration: 700, easing: 'easeInOutCubic',
    });
  }

  function makeLine(srcXY, dstXY, cls) {
    const [sx, sy] = srcXY, [dx, dy] = dstXY;
    const len = Math.hypot(dx - sx, dy - sy);
    const ang = Math.atan2(dy - sy, dx - sx) * 180 / Math.PI;
    const el = document.createElement('div');
    el.className = 'bl1-line';
    if (cls) el.style.background = cls;
    el.style.width = len + 'px';
    el.style.opacity = 0;
    world.insertBefore(el, world.firstChild);
    anime.set(el, { translateX: sx, translateY: sy, rotate: ang });
    return el;
  }

  function ensureRing() {
    if (ring) return;
    ring = document.createElement('div');
    ring.className = 'bl1-ring';
    ring.style.opacity = 0;
    world.appendChild(ring);
  }
  function spinRing(seq, onDone) {
    let i = 0;
    (function step() {
      const [x, y] = MIN[seq[i]];
      anime.set(ring, { translateX: x, translateY: y });
      i++;
      if (i >= seq.length) { onDone(); return; }
      TM.pause(70 + i * 16, step);
    })();
  }

  // ---- stage 1: neighbourhood of DEMO across both classes ----
  const NBR = mnn(DEMO, M);
  function showNbr(spin) {
    if (nbrShown) return;
    nbrShown = true;
    ensureRing();
    const draw = () => {
      if (!nbrLines.length)
        NBR.forEach(o => nbrLines.push(makeLine(MIN[DEMO], pt(o.gi), null)));
      TM.anime({ targets: nbrLines, opacity: 0.85, duration: 350, easing: 'easeInOutQuad', delay: anime.stagger(60) });
    };
    if (spin) {
      const HOP = [0, 3, 7, 10, 4, 9, 1, DEMO];
      anime.set(ring, { translateX: MIN[HOP[0]][0], translateY: MIN[HOP[0]][1] });
      TM.anime({ targets: ring, opacity: 1, duration: 200, easing: 'easeOutQuad' });
      spinRing(HOP, () => TM.pause(150, draw));
    } else {
      anime.set(ring, { translateX: MIN[DEMO][0], translateY: MIN[DEMO][1], opacity: 1 });
      draw();
    }
  }
  function hideNbr() {
    if (!nbrShown) return;
    nbrShown = false;
    if (ring) TM.anime({ targets: ring, opacity: 0, duration: 250, easing: 'easeInOutQuad' });
    if (nbrLines.length) {
      const dying = nbrLines; nbrLines = [];
      TM.anime({ targets: dying, opacity: 0, duration: 200, easing: 'easeInOutQuad',
        complete: () => dying.forEach(l => l.remove()) });
    }
  }

  // ---- stage 4: synthesise from SYNTH_SRC along a minority-neighbour line ----
  const SRC_NBRS = knnMin(SYNTH_SRC, K);
  function lineRoulette(onDone) {
    const seq = [0, 3, 1, 4, 2, 0, 3, PICK];
    let i = 0;
    (function step() {
      const hop = seq[i];
      if (knnLines.length) knnLines.forEach((l, j) => anime.set(l, { opacity: j === hop ? 1 : 0.18 }));
      i++;
      if (i >= seq.length) { onDone(); return; }
      TM.pause(90 + i * 18, step);
    })();
  }
  function showSynth4(animate) {
    if (synth4Shown) return;
    synth4Shown = true;
    ensureRing();
    const [cx, cy] = MIN[SYNTH_SRC], [nx, ny] = MIN[SRC_NBRS[PICK]];
    const fx = f => cx + f * (nx - cx), fy = f => cy + f * (ny - cy);
    const drawLines = () => {
      if (!knnLines.length) SRC_NBRS.forEach(j => knnLines.push(makeLine(MIN[SYNTH_SRC], MIN[j], C_MIN)));
    };
    if (!animate) {
      anime.set(ring, { translateX: cx, translateY: cy, opacity: 1 });
      drawLines();
      knnLines.forEach((l, i) => anime.set(l, { opacity: i === PICK ? 1 : 0.18 }));
      synthDot = makeDot(cx, cy, C_SYN, true);
      anime.set(synthDot, { translateX: fx(LAMBDA), translateY: fy(LAMBDA), scale: 1.18 });
      return;
    }
    const HOP = [6, 8, 10, 9, 6, 10, SYNTH_SRC];
    anime.set(ring, { translateX: MIN[HOP[0]][0], translateY: MIN[HOP[0]][1] });
    TM.anime({ targets: ring, opacity: 1, duration: 200, easing: 'easeOutQuad' });
    spinRing(HOP, () => {
      drawLines();
      TM.anime({ targets: knnLines, opacity: 1, duration: 300, easing: 'easeInOutQuad', delay: anime.stagger(50),
        complete: () => lineRoulette(() => TM.pause(150, () => {
          synthDot = makeDot(cx, cy, C_SYN, true);
          anime.set(synthDot, { scale: 1.18 });
          const frames = [0.85, 0.2, LAMBDA];
          TM.anime({
            targets: synthDot,
            translateX: frames.map((f, i) => ({ value: fx(f), duration: i === 0 ? 500 : 420 })),
            translateY: frames.map((f, i) => ({ value: fy(f), duration: i === 0 ? 500 : 420 })),
            easing: 'easeInOutCubic',
          });
        })) });
    });
  }
  function hideSynth4() {
    if (!synth4Shown) return;
    synth4Shown = false;
    if (ring) TM.anime({ targets: ring, opacity: 0, duration: 250, easing: 'easeInOutQuad' });
    if (knnLines.length) {
      const dying = knnLines; knnLines = [];
      TM.anime({ targets: dying, opacity: 0, duration: 200, easing: 'easeInOutQuad',
        complete: () => dying.forEach(l => l.remove()) });
    }
    if (synthDot) {
      const d = synthDot; synthDot = null;
      TM.anime({ targets: d, opacity: 0, duration: 200, easing: 'easeInOutQuad', complete: () => d.remove() });
    }
  }

  // ---- stage 5: many synthetic points along the border ----
  function showExtra(animate) {
    if (extraShown) return;
    extraShown = true;
    SYNTH_SPECS.forEach(([a, b, t]) => {
      const x = MIN[a][0] + t * (MIN[b][0] - MIN[a][0]);
      const y = MIN[a][1] + t * (MIN[b][1] - MIN[a][1]);
      const d = makeDot(x, y, C_SYN, true);
      extra.push(d);
      anime.set(d, { scale: animate ? 0 : 1.15, opacity: animate ? 0 : 1 });
    });
    if (animate) TM.anime({ targets: extra, scale: 1.15, opacity: 1, duration: 450, easing: 'easeOutBack', delay: anime.stagger(60) });
  }
  function hideExtra() {
    if (!extraShown) return;
    extraShown = false;
    const dying = extra; extra = [];
    if (!dying.length) return;
    TM.anime({ targets: dying, scale: 0, opacity: 0, duration: 300, easing: 'easeInQuad',
      complete: () => dying.forEach(d => d.remove()) });
  }

  function setTitle(text) {
    const t = document.getElementById('bl1-title');
    if (!t) return;
    t.textContent = text;
    TM.anime({ targets: t, opacity: text ? 1 : 0, duration: 400, easing: 'easeInOutQuad' });
  }

  function render(stage) {
    if (!build()) return;

    const keepDanger = stage >= 3 && stage < 5;   // isolate danger points + zoom
    zoom(keepDanger);

    // majority opacity: dim while we isolate the border, else full.
    TM.anime({ targets: majDots, opacity: keepDanger ? 0.18 : 1, duration: 500, easing: 'easeInOutQuad' });

    // minority colour: plain pink until classified (stage >= 2), then by label.
    const classified = stage >= 2;
    minDots.forEach((d, i) => {
      TM.anime({ targets: d, backgroundColor: classified ? colorFor(i) : C_MIN, duration: 450, easing: 'easeInOutQuad' });
      // opacity: dim SAFE/NOISE while isolating danger (stage 3-4); full otherwise.
      const dim = keepDanger && LABEL[i] !== 'DANGER';
      const sc = (classified && LABEL[i] === 'DANGER') ? 1.2 : 1;
      TM.anime({ targets: d, opacity: dim ? 0.18 : 1, scale: sc,
        translateX: MIN[i][0], translateY: MIN[i][1], duration: 500, easing: 'easeOutBack' });
    });

    // legend visible from stage 2 onward.
    TM.anime({ targets: legend, opacity: stage >= 2 ? 1 : 0, duration: 400, easing: 'easeInOutQuad' });

    if (stage === 1) showNbr(!nbrShown); else hideNbr();

    const synth = stage === 4;   // single-point scaffold only on stage 4
    if (synth) showSynth4(!synth4Shown); else hideSynth4();

    const many = stage >= 5;
    if (many) showExtra(!extraShown); else hideExtra();

    setTitle(
      many ? 'New points cluster on the border, where the classifier needs them'
      : synth ? 'Interpolate toward a nearest minority neighbour:  new = xᵢ + λ·(nbr − xᵢ)'
      : keepDanger ? 'Borderline-SMOTE1 oversamples only the DANGER points'
      : classified ? 'SAFE (mostly minority) · DANGER (borderline) · NOISE (all majority)'
      : stage === 1 ? 'For each minority point, look at its m = 5 nearest neighbours (both classes)'
      : 'Imbalanced classes');
  }

  TM.gate({
    markerClass: 'bl1-slide',
    fragmentIds: ['bl1-neighbourhood', 'bl1-classify', 'bl1-danger', 'bl1-synth', 'bl1-repeat'],
    render,
  });
})();
</script>
