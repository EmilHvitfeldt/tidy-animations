    /* ---- tidy-animations shared infrastructure ----
     * Ported from the anime.js + RevealJS lessons. Kept deliberately small:
     * coordinate conversion, slide lookup, and a fragment/slide gating helper
     * that drives a single idempotent render(stage) per animation.
     */
    window.TM = window.TM || {};

    /* Register listeners as soon as Reveal exists — do NOT wait for 'ready',
     * because include-after-body scripts often load after Reveal initialises. */
    TM.onReveal = function (cb) {
      (function go() {
        if (typeof Reveal === 'undefined' || !Reveal.on) { setTimeout(go, 50); return; }
        cb();
      })();
    };

    /* ---- activity tracking (so a recorder can wait for "idle" instead of guessing
     * delays). Every animation goes through TM.anime; intentional pauses use
     * TM.busyInc/busyDec so they count as busy too. TM.idle() is true only when
     * nothing is animating and no pause is pending. */
    TM._busy = 0;
    TM.busyInc = function () { TM._busy++; };
    TM.busyDec = function () { TM._busy = Math.max(0, TM._busy - 1); };
    TM.idle = function () { return TM._busy === 0; };
    TM.anime = function (params) {
      TM.busyInc();
      const inst = anime(params);
      inst.finished.then(TM.busyDec, TM.busyDec);  // decrement when it settles (or errors)
      return inst;
    };
    /* a tracked timed gap: stays "busy" for `ms`, then runs fn. Increment the next
     * step before this decrements (do that inside fn) to avoid a momentary idle dip. */
    TM.pause = function (ms, fn) {
      TM.busyInc();
      setTimeout(function () { if (fn) fn(); TM.busyDec(); }, ms);
    };

    /* screen pixels -> slide internal coordinate units */
    TM.cssToSlide = function (px, section) {
      const w = section.getBoundingClientRect().width;
      return px * (Reveal.getConfig().width / w);
    };

    TM.sectionFor = function (markerClass) {
      const el = document.querySelector('.' + markerClass);
      return el ? el.closest('section') : null;
    };

     *   markerClass : class on the slide section
     *   fragmentIds : array of fragment element ids, in advancing order
     *   render(stage): called with the number of those fragments currently visible
     * Fires on fragmentshown/hidden and on slidechanged (forward, back, and
     * direct-link arrival all resolve to the same stage number). */

        let n = 0;
        for (const id of fragmentIds) {
          const f = document.getElementById(id);
          if (f && f.classList.contains('visible')) n++; else break;
        }

                         slide.querySelector('.' + markerClass));

          if (onThisSlide(cur)) render(visibleStage());
        })();

          { t: 'species_Chinstrap = species_Chinstrap / 0.4001953', src: 'species_Chinstrap' },
          { t: 'species_Gentoo = species_Gentoo / 0.484043',        src: 'species_Gentoo' },
          { t: 'island_Dream = island_Dream / 0.4795927',           src: 'island_Dream' },
          { t: 'island_Torgersen = island_Torgersen / 0.3562296',   src: 'island_Torgersen' },
          { t: 'sex_male = sex_male / 0.5002297',                   src: 'sex_male' },
        ]},
        { chip: 'step_center()', lines: [
          { t: 'bill_length_mm = bill_length_mm - 8.04911',        src: 'bill_length_mm' },
          { t: 'bill_depth_mm = bill_depth_mm - 8.628085',         src: 'bill_depth_mm' },
          { t: 'flipper_length_mm = flipper_length_mm - 14.32021', src: 'flipper_length_mm' },
          { t: 'species_Chinstrap = species_Chinstrap - 0.4978039', src: 'species_Chinstrap' },
          { t: 'species_Gentoo = species_Gentoo - 0.7666532',      src: 'species_Gentoo' },
          { t: 'island_Dream = island_Dream - 0.7411888',          src: 'island_Dream' },
          { t: 'island_Torgersen = island_Torgersen - 0.4166906',  src: 'island_Torgersen' },
          { t: 'sex_male = sex_male - 0.9448784',                  src: 'sex_male' },
        ]},
        { chip: 'model', lines: [
          { t: '.pred = case_when(',                                                            src: null },
          { t: '  sex_male <= -0.9448784 & bill_length_mm <= -0.2162576 ~ 3425.781,',           src: null },
          { t: '  sex_male >  -0.9448784 & bill_length_mm <= -0.2162576 ~ 4028.804,',           src: null },
          { t: '  species_Chinstrap <= -0.4978039 & bill_length_mm > -0.2162576 ~ 5008.838,',   src: null },
          { t: '  species_Chinstrap >  -0.4978039 & bill_length_mm > -0.2162576 ~ 3786.702',    src: null },
          { t: ')',                                                                             src: null },
        ]},
      ];
      const MODEL_BI = 5;   // index of the model block (always fully highlighted)

      // ---- left panel: the fitted pipeline as code. Each step line maps to the
      // stage (1-6) that emits its generated-code block; header/blank lines are
      // context (stage null). ----
      const lfn = (s) => `<span class="oc-fn">${s}</span>`;
      const lsel = (s) => `<span class="oc-sel">${s}</span>`;
      const LCODE = [
        { html: `${lfn('recipe')}(body_mass_g ~ ., data = penguins) |&gt;`,             stage: null },
        { html: `  ${lfn('step_unknown')}(${lsel('all_nominal_predictors()')}) |&gt;`,   stage: 1 },
        { html: `  ${lfn('step_impute_median')}(${lsel('all_numeric_predictors()')}) |&gt;`, stage: 2 },
        { html: `  ${lfn('step_dummy')}(${lsel('all_nominal_predictors()')}) |&gt;`,     stage: 3 },
        { html: `  ${lfn('step_scale')}(${lsel('all_numeric_predictors()')}) |&gt;`,     stage: 4 },
        { html: `  ${lfn('step_center')}(${lsel('all_numeric_predictors()')})`,          stage: 5 },
        { html: ``,                                                                      stage: null },
        { html: `${lfn('decision_tree')}(mode = "regression")`,                          stage: 6 },
      ];

      const TITLE_P1 = 'orbital translates each recipe step into code';
      const TITLE_P2 = 'which inputs does the prediction actually use?';
      const TITLE_FINAL = 'the prediction reduces to just these lines';

      // ---- the trace, one entry per stage from stage 8 up. `R` = block index being
      // examined this stage (blocks below it are already settled); `sub` = 'lhs'
      // (highlight only the LHS term we already track) or 'full' (also highlight the
      // RHS source, adding any new one); `T` = the running terms list. Each block
      // above the model does LHS first, then RHS. ----
      const T0 = ['bill_length_mm', 'species_Chinstrap', 'sex_male'];
      const T1 = ['bill_length_mm', 'species_Chinstrap', 'sex_male', 'species', 'sex'];
      const TRACE = [
        { R: 5, sub: 'full', T: T0 },   // stage 8  model predictors
        { R: 4, sub: 'lhs',  T: T0 },   // stage 9  center  LHS
        { R: 4, sub: 'full', T: T0 },   // stage 10 center  RHS
        { R: 3, sub: 'lhs',  T: T0 },   // stage 11 scale   LHS
        { R: 3, sub: 'full', T: T0 },   // stage 12 scale   RHS
        { R: 2, sub: 'lhs',  T: T0 },   // stage 13 dummy   LHS
        { R: 2, sub: 'full', T: T1 },   // stage 14 dummy   RHS (adds species, sex)
        { R: 1, sub: 'lhs',  T: T1 },   // stage 15 impute  LHS
        { R: 1, sub: 'full', T: T1 },   // stage 16 impute  RHS
        { R: 0, sub: 'lhs',  T: T1 },   // stage 17 unknown LHS
        { R: 0, sub: 'full', T: T1 },   // stage 18 unknown RHS
      ];
      const FINAL_STAGE = 8 + TRACE.length;   // 19: collapse to the lines that matter

      let built = false;
      let lineEls = [];          // { el, stage } for each left-code line
      let stageY = {};           // stage -> vertical centre of its code line
      let arrowLine = null, titleEl = null;
      let termsEl = null, termListEl = null, stageEl = null;
      let prevStage = -1;            // to detect forward entry (fly-in only then)
      // per block: { top, els:[lineEl,...] }
      let blocks = [];

      // screen-space rect -> the stage's internal (1220x640) coordinate space
      function rectToStage(rect) {
        const r = stageEl.getBoundingClientRect();
        const fx = 1220 / r.width, fy = STAGE_H / r.height;
        return { x: (rect.left - r.left) * fx, y: (rect.top - r.top) * fy,
                 w: rect.width * fx, h: rect.height * fy };
      }
      // first highlighted token in the code whose text matches `term`
      function findToken(term) {
        const toks = stageEl.querySelectorAll('.oc-line.oc-pink .oc-tok');
        for (const t of toks) if (t.textContent === term) return t;
        return null;
      }
      // fly a little pill from a code token into its slot in the terms list
      function flyTerm(term, sourceEl, targetEl, delay) {
        const s = rectToStage(sourceEl.getBoundingClientRect());
        const d = rectToStage(targetEl.getBoundingClientRect());
        const fly = document.createElement('div');
        fly.className = 'oc-fly';
        fly.textContent = term;
        const c = COLORS[term];
        if (c) { fly.style.background = c.bg; fly.style.color = c.fg; }
        anime.set(fly, { translateX: s.x, translateY: s.y });
        stageEl.appendChild(fly);
        targetEl.style.opacity = 0;
        TM.anime({ targets: fly, translateX: d.x + 16, translateY: d.y + d.h / 2 - 11,
                   duration: 620, delay: delay, easing: 'easeInOutCubic',
                   complete: () => fly.remove() });
        TM.anime({ targets: targetEl, opacity: [0, 1], duration: 260,
                   delay: delay + 520, easing: 'easeOutQuad' });
      }

      function build() {
        const stage = document.getElementById('oc-stage');
        if (!stage || built) return !!stage;
        built = true;
        stageEl = stage;
        titleEl = document.getElementById('oc-title');

        // recipe code (left)
        LCODE.forEach((ln, i) => {
          const el = document.createElement('div');
          el.className = 'oc-code-line';
          el.innerHTML = ln.html;
          const y = LCODE_Y0 + i * LCODE_LINEH;
          anime.set(el, { translateX: LCODE_X, translateY: y });
          stage.appendChild(el);
          lineEls.push({ el, stage: ln.stage });
          if (ln.stage) stageY[ln.stage] = y + LCODE_LINEH / 2;
        });

        // phase-2 "terms to account for" panel (same left column, hidden in phase 1)
        termsEl = document.createElement('div');
        termsEl.className = 'oc-terms';
        termsEl.style.opacity = 0;
        termsEl.innerHTML = '<div class="oc-term-title">terms to account for</div><div class="oc-term-list"></div>';
        anime.set(termsEl, { translateX: LCODE_X, translateY: LCODE_Y0 });
        stage.appendChild(termsEl);
        termListEl = termsEl.querySelector('.oc-term-list');

        // code lines (right), grouped into blocks
        let y = CODE_Y0;
        BLOCKS.forEach((blk) => {
          const top = y;
          const els = [];
          blk.lines.forEach((ln) => {
            ln.lhs = splitAssign(ln.t)[0];        // variable defined by this line
            const el = document.createElement('div');
            el.className = 'oc-line';
            el.textContent = ln.t;
            el.style.opacity = 0;
            el._y = y;                            // original y (restored after final)
            anime.set(el, { translateX: CODE_X, translateY: y });
            stage.appendChild(el);
            els.push(el);
            y += LINEH;
          });
          y += BLOCK_GAP;
          blocks.push({ top, els });
        });

        // connector arrow overlay
        const svg = document.createElementNS(SVGNS, 'svg');
        svg.setAttribute('class', 'oc-arrows');
        svg.setAttribute('width', 1220);
        svg.setAttribute('height', STAGE_H);
        const defs = document.createElementNS(SVGNS, 'defs');
        const marker = document.createElementNS(SVGNS, 'marker');
        marker.setAttribute('id', 'oc-ah');
        marker.setAttribute('markerWidth', 8); marker.setAttribute('markerHeight', 8);
        marker.setAttribute('refX', 6); marker.setAttribute('refY', 3);
        marker.setAttribute('orient', 'auto');
        const mpath = document.createElementNS(SVGNS, 'path');
        mpath.setAttribute('d', 'M0,0 L6,3 L0,6 Z');
        mpath.setAttribute('fill', getComputedStyle(document.documentElement).getPropertyValue('--oc-pink') || '#d6336c');
        marker.appendChild(mpath); defs.appendChild(marker); svg.appendChild(defs);
        arrowLine = document.createElementNS(SVGNS, 'path');
        arrowLine.setAttribute('class', 'oc-arrow-line');
        arrowLine.setAttribute('marker-end', 'url(#oc-ah)');
        arrowLine.style.opacity = 0;
        svg.appendChild(arrowLine);
        stage.appendChild(svg);

        return true;
      }

      // curved connector from the active recipe line to its emitted code block
      function positionArrow(s) {
        const x1 = ARROW_X, y1 = stageY[s];
        const x2 = CODE_X - 10, y2 = blocks[s - 1].top + 10;
        const mx = (x1 + x2) / 2;
        arrowLine.setAttribute('d', `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
      }

      function render(stage) {
        if (!build()) return;

        // stage 7 is a transition: chips gone, empty "terms" panel, no highlighting.
        const leftTerms = stage >= 7;             // show terms panel instead of chips
        const final = stage >= FINAL_STAGE;       // collapse to the lines that matter
        const tr = (stage >= 8 && stage - 8 < TRACE.length) ? TRACE[stage - 8] : null;
        const T = tr ? tr.T : null;
        const isImportant = (bi, line) => (bi === MODEL_BI) || T1.indexOf(line.lhs) !== -1;

        if (titleEl) {
          titleEl.textContent = stage === 0 ? '' : (final ? TITLE_FINAL : (leftTerms ? TITLE_P2 : TITLE_P1));
          titleEl.style.opacity = stage === 0 ? 0 : 1;
        }

        // final stage: compact the surviving (important) lines into a tidy list
        let compactY = null;
        if (final) {
          compactY = new Map();
          let y = CODE_Y0, prevBi = -1;
          blocks.forEach((blk, bi) => blk.els.forEach((el, li) => {
            if (!isImportant(bi, BLOCKS[bi].lines[li])) return;
            if (prevBi !== -1 && bi !== prevBi) y += BLOCK_GAP;
            compactY.set(el, y);
            y += LINEH;
            prevBi = bi;
          }));
        }

        // code blocks
        blocks.forEach((blk, bi) => {
          const b = bi + 1;
          blk.els.forEach((el, li) => {
            const line = BLOCKS[bi].lines[li];
            el.classList.remove('oc-pink', 'oc-dim');

            // final: fade the faded lines out first, THEN slide the survivors
            // together (the translate is delayed until after the fade completes).
            if (final) {
              const important = isImportant(bi, line);
              el.textContent = line.t;
              if (!important) {
                TM.anime({ targets: el, opacity: 0, duration: 350, easing: 'easeOutQuad' });
              } else {
                TM.anime({ targets: el, opacity: 1, duration: 200, easing: 'easeOutQuad' });
                TM.anime({ targets: el, translateX: CODE_X, translateY: compactY.get(el),
                           duration: 520, delay: 450, easing: 'easeInOutCubic' });
              }
              return;
            }

            // otherwise keep lines at their original positions
            anime.set(el, { translateX: CODE_X, translateY: el._y });
            TM.anime({ targets: el, opacity: stage >= b ? 1 : 0, duration: 350, easing: 'easeOutQuad' });

            // not tracing yet, or this block is above the one we've reached: plain
            if (!tr || bi < tr.R) { el.textContent = line.t; return; }
            const relevant = (bi === MODEL_BI) || T.indexOf(line.lhs) !== -1;
            if (!relevant) { el.classList.add('oc-dim'); el.textContent = line.t; return; }
            el.classList.add('oc-pink');
            // the block being examined in its 'lhs' sub-step: highlight only the
            // LHS term we already track; everything else shows full highlight.
            if (bi === tr.R && tr.sub === 'lhs') {
              el.innerHTML = highlightLHS(line.t);
            } else {
              el.innerHTML = highlightTerms(line.t, T);
            }
          });
        });

        // left column: recipe code while emitting, "terms to account for" panel after
        lineEls.forEach(({ el, stage: st }) => {
          el.classList.toggle('oc-active', !leftTerms && st === stage);
          el.classList.toggle('oc-done', !leftTerms && st !== null && st < stage);
          TM.anime({ targets: el, opacity: leftTerms ? 0 : 1, duration: 300, easing: 'easeOutQuad' });
        });
        // terms list: empty during the transition, then fills in as we trace up.
        // On forward entry, terms newly added this stage fly in from their token.
        const prevT = (prevStage >= 8 && prevStage - 8 < TRACE.length) ? TRACE[prevStage - 8].T : [];
        const added = (tr && stage === prevStage + 1) ? T.filter((x) => prevT.indexOf(x) === -1) : [];
        termListEl.innerHTML = tr
          ? T.map((t) => {
              const c = COLORS[t] || {};
              return `<div class="oc-term" data-term="${t}" style="border-color:${c.fg};background:${c.bg};color:${c.fg}">${t}</div>`;
            }).join('')
          : '';
        added.forEach((term, i) => {
          const targetEl = termListEl.querySelector('.oc-term[data-term="' + term + '"]');
          const srcTok = findToken(term);
          if (targetEl && srcTok) flyTerm(term, srcTok, targetEl, i * 150);
        });
        TM.anime({ targets: termsEl, opacity: (leftTerms && !final) ? 1 : 0, duration: 300, easing: 'easeOutQuad' });

        prevStage = stage;

        // connector arrow points the active recipe line -> its block (phase 1)
        if (!leftTerms && stage >= 1 && stage <= 6) {
          positionArrow(stage);
          TM.anime({ targets: arrowLine, opacity: 1, duration: 300, easing: 'easeOutQuad' });
        } else {
          TM.anime({ targets: arrowLine, opacity: 0, duration: 300, easing: 'easeOutQuad' });
        }
      }

      TM.gate({
        markerClass: 'oc-slide',
        fragmentIds: [
          'oc-unknown', 'oc-impute', 'oc-dummy', 'oc-scale', 'oc-center', 'oc-model',
          'oc-terms-setup',
          'oc-trace-model',
          'oc-trace-center-rhs', 'oc-trace-center-lhs',
          'oc-trace-scale-rhs', 'oc-trace-scale-lhs',
          'oc-trace-dummy-rhs', 'oc-trace-dummy-lhs',
          'oc-trace-impute-rhs', 'oc-trace-impute-lhs',
          'oc-trace-unknown-rhs', 'oc-trace-unknown-lhs',
          'oc-final',
        ],
        render,
      });
    })();
    </script>

          var localhostRegex = new RegExp(/^(?:http|https):\/\/localhost\:?[0-9]*\//);
