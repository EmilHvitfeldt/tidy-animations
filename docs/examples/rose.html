    <script>
    /* ---- tidy-animations shared infrastructure ----
     * Ported from the anime.js + RevealJS lessons. Kept deliberately small:
     * coordinate conversion, slide lookup, and a fragment/slide gating helper
     * that drives a single idempotent render(stage) per animation.
     */
    window.TM = window.TM || {};

    /* Register listeners as soon as Reveal exists — do NOT wait for 'ready',
     * because include-after-body scripts often load after Reveal initialises. */
    TM.onReveal = function (cb) {
      (function go() {
        if (typeof Reveal === 'undefined' || !Reveal.on) { setTimeout(go, 50); return; }
        cb();
      })();
    };

    /* ---- activity tracking (so a recorder can wait for "idle" instead of guessing
     * delays). Every animation goes through TM.anime; intentional pauses use
     * TM.busyInc/busyDec so they count as busy too. TM.idle() is true only when
     * nothing is animating and no pause is pending. */
    TM._busy = 0;
    TM.busyInc = function () { TM._busy++; };
    TM.busyDec = function () { TM._busy = Math.max(0, TM._busy - 1); };
    TM.idle = function () { return TM._busy === 0; };
    TM.anime = function (params) {
      TM.busyInc();
      const inst = anime(params);
      inst.finished.then(TM.busyDec, TM.busyDec);  // decrement when it settles (or errors)
      return inst;
    };
    /* a tracked timed gap: stays "busy" for `ms`, then runs fn. Increment the next
     * step before this decrements (do that inside fn) to avoid a momentary idle dip. */
    TM.pause = function (ms, fn) {
      TM.busyInc();
      setTimeout(function () { if (fn) fn(); TM.busyDec(); }, ms);
    };

    /* screen pixels -> slide internal coordinate units */
    TM.cssToSlide = function (px, section) {
      const w = section.getBoundingClientRect().width;
      return px * (Reveal.getConfig().width / w);
    };

    /* find the <section> carrying a marker class (querySelector won't match self) */
    TM.sectionFor = function (markerClass) {
      const el = document.querySelector('.' + markerClass);
      return el ? el.closest('section') : null;
    };

    /* Gate an animation behind a slide + ordered fragment ids.
     *   markerClass : class on the slide section
     *   fragmentIds : array of fragment element ids, in advancing order
     *   render(stage): called with the number of those fragments currently visible
     * Fires on fragmentshown/hidden and on slidechanged (forward, back, and
     * direct-link arrival all resolve to the same stage number). */
    TM.gate = function ({ markerClass, fragmentIds, render }) {
      function visibleStage() {
        let n = 0;
        for (const id of fragmentIds) {
          const f = document.getElementById(id);
          if (f && f.classList.contains('visible')) n++; else break;
        }
        return n;
      }
      function onThisSlide(slide) {
        return slide && (slide.classList.contains(markerClass) ||
                         slide.querySelector('.' + markerClass));
      }
      TM.onReveal(function () {
        Reveal.on('fragmentshown',  () => { if (onThisSlide(Reveal.getCurrentSlide())) render(visibleStage()); });
        Reveal.on('fragmenthidden', () => { if (onThisSlide(Reveal.getCurrentSlide())) render(visibleStage()); });
        Reveal.on('slidechanged', ({ currentSlide }) => {
          if (onThisSlide(currentSlide)) render(visibleStage());
        });
        // direct-link / reload arrival: render once Reveal can report the slide
        (function boot() {
          const cur = Reveal.getCurrentSlide && Reveal.getCurrentSlide();
          if (!cur) { setTimeout(boot, 60); return; }
          if (onThisSlide(cur)) render(visibleStage());
        })();
      });
    };
    </script>
    <script>
    /* ---- ROSE animation ----
     * Marker slide: .rose-slide   Stage container: #rose-stage
     * render(stage) is idempotent (stage = number of visible gating fragments).
     *
     * ROSE (Random OverSampling Examples) does not copy or interpolate points. It
     * bootstraps an observation, then draws a NEW point from a Gaussian kernel
     * centred on it. themis::rose() wraps ROSE::ROSE() with N = 2 * majority size
     * and p = 0.5, so the output is an entirely new, balanced sample and BOTH
     * classes get smoothed — not just the minority. See themis R/rose.R.
     *
     * Segments (stage 0 = slide arrival):
     *   0 imbalanced: 30 majority against 10 minority
     *   1 a smoothing kernel sits around an observation
     *   2 a new point is drawn from that kernel
     *   3 repeat: bootstrap a point, draw from its kernel, for both classes
     *   4 the originals are not kept; the draws are the returned sample
     *   5 balanced 30/30, both classes smoothed
     */
    (function () {
      // [majority, minority]
      const COLORS = window.ROSE_COLORS || ['#c8ccd4', '#d6336c'];
      const [C_MAJ, C_MIN] = COLORS;

      // Hardcoded layout and draws (rolled once offline with the rule-of-thumb
      // bandwidth ROSE uses for d = 2, h = (4 / ((d + 2) n))^(1 / (d + 4)) scaled
      // per axis by that class's sd). Third entry of a draw is the observation it
      // was bootstrapped from. Rejection-sampled inside the stage, so nothing piles
      // up against the rim.
      const MAJ = [
        [376, 450], [202, 419], [316, 269], [683, 319], [353, 388],
        [552, 296], [460, 183], [134, 119], [83, 271], [372, 140],
        [346, 329], [119, 432], [416, 263], [438, 363], [259, 227],
        [192, 295], [642, 62], [542, 212], [334, 219], [619, 414],
        [278, 337], [281, 498], [710, 71], [416, 416], [690, 364],
        [492, 229], [160, 336], [219, 173], [140, 239], [114, 380],
      ];
      const MIN = [
        [777, 354], [902, 253], [754, 265], [645, 337], [684, 190],
        [726, 186], [722, 112], [809, 275], [737, 362], [607, 201],
      ];
      const SMAJ = [
        [496, 243, 25], [411, 266, 6], [58, 323, 8], [162, 330, 29], [429, 183, 6],
        [42, 372, 15], [543, 349, 3], [355, 368, 4], [51, 298, 20], [348, 474, 21],
        [505, 262, 14], [454, 282, 10], [257, 189, 2], [115, 215, 26], [153, 202, 10],
        [727, 397, 19], [294, 190, 8], [285, 194, 6], [528, 384, 13], [670, 82, 16],
        [568, 48, 16], [542, 222, 22], [324, 210, 28], [295, 259, 9], [882, 454, 19],
        [519, 445, 0], [473, 64, 6], [183, 432, 4], [324, 401, 4], [828, 358, 24],
      ];
      const SMIN = [
        [736, 278, 7], [838, 205, 7], [770, 342, 7], [943, 164, 1], [677, 235, 9],
        [650, 277, 9], [831, 260, 8], [743, 261, 5], [658, 191, 4], [840, 278, 7],
        [886, 285, 1], [830, 221, 7], [630, 368, 3], [580, 375, 3], [635, 356, 3],
        [689, 384, 0], [705, 412, 3], [789, 196, 5], [834, 360, 8], [818, 338, 7],
        [618, 295, 3], [756, 183, 2], [769, 56, 6], [784, 200, 2], [768, 36, 6],
        [832, 268, 1], [760, 184, 2], [874, 289, 7], [655, 362, 3], [733, 285, 8],
      ];

      // kernel half-extents (2 sd) used to draw the ellipse
      const KMAJ = [210, 126], KMIN = [108, 106];

      const DEMO = 7;                 // minority point we walk through
      const DEMO_DRAW = 0;            // index into SMIN, a draw from DEMO

      let built = false, world = null;
      let majDots = [], minDots = [], synMaj = [], synMin = [];
      let kernel = null, demoLink = null;
      const counts = [];

      function makeDot(x, y, color, cls) {
        const d = document.createElement('div');
        d.className = cls;
        d.style.backgroundColor = color;
        world.appendChild(d);
        anime.set(d, { translateX: x, translateY: y, scale: 1, opacity: 1 });
        return d;
      }

      function buildLegend(stageEl) {
        const box = document.createElement('div');
        box.className = 'rose-legend';
        [['majority', C_MAJ, MAJ.length], ['minority', C_MIN, MIN.length]].forEach(
          ([label, color, n]) => {
            const row = document.createElement('div');
            row.className = 'rose-legend-item';
            const sw = document.createElement('span');
            sw.className = 'rose-swatch';
            sw.style.backgroundColor = color;
            const txt = document.createElement('span');
            txt.textContent = label + ' ';
            const num = document.createElement('span');
            num.className = 'rose-count';
            num.textContent = n;
            row.append(sw, txt, num);
            box.appendChild(row);
            counts.push(num);
          });
        stageEl.appendChild(box);
      }

      function build() {
        const stageEl = document.getElementById('rose-stage');
        if (!stageEl || built) return !!stageEl;
        built = true;
        world = document.createElement('div');
        world.className = 'rose-world';
        stageEl.appendChild(world);

        // kernel ellipse sits behind everything
        kernel = document.createElement('div');
        kernel.className = 'rose-kernel';
        kernel.style.width = KMIN[0] * 2 + 'px';
        kernel.style.height = KMIN[1] * 2 + 'px';
        kernel.style.marginLeft = -KMIN[0] + 'px';
        kernel.style.marginTop = -KMIN[1] + 'px';
        world.appendChild(kernel);
        anime.set(kernel, { translateX: MIN[DEMO][0], translateY: MIN[DEMO][1], scale: 0.4, opacity: 0 });

        MAJ.forEach(([x, y]) => majDots.push(makeDot(x, y, C_MAJ, 'rose-dot')));
        MIN.forEach(([x, y]) => minDots.push(makeDot(x, y, C_MIN, 'rose-dot')));

        SMAJ.forEach(([x, y]) => {
          const d = makeDot(x, y, C_MAJ, 'rose-dot is-syn');
          anime.set(d, { scale: 0, opacity: 0 });
          synMaj.push(d);
        });
        SMIN.forEach(([x, y]) => {
          const d = makeDot(x, y, C_MIN, 'rose-dot is-syn');
          anime.set(d, { scale: 0, opacity: 0 });
          synMin.push(d);
        });

        buildLegend(stageEl);
        return true;
      }

      function setCount(el, value) {
        if (el.textContent === String(value)) return;
        el.textContent = value;
        TM.anime({ targets: el, scale: [1.35, 1], duration: 420, easing: 'easeOutBack' });
      }

      function setTitle(text) {
        const t = document.getElementById('rose-title');
        if (!t) return;
        t.textContent = text;
        TM.anime({ targets: t, opacity: text ? 1 : 0, duration: 400, easing: 'easeInOutQuad' });
      }

      function render(stage) {
        if (!build()) return;

        const demoing = stage === 1 || stage === 2;
        const originalsGone = stage >= 4;

        // ---- the kernel around the demo point ----
        TM.anime({ targets: kernel, scale: demoing ? 1 : 0.4, opacity: demoing ? 1 : 0,
          duration: 500, easing: 'easeOutBack' });

        // ---- originals: dim while demoing, dim again under the draws, then go ----
        majDots.forEach((d, i) => {
          TM.anime({ targets: d, scale: originalsGone ? 0 : 1,
            opacity: originalsGone ? 0 : (demoing ? 0.25 : (stage === 3 ? 0.28 : 1)),
            duration: originalsGone ? 600 : 450, easing: originalsGone ? 'easeInBack' : 'easeInOutQuad',
            delay: originalsGone ? anime.stagger(10) : 0 });
        });
        minDots.forEach((d, i) => {
          const spotlight = demoing && i === DEMO;
          TM.anime({ targets: d, scale: originalsGone ? 0 : (spotlight ? 1.25 : 1),
            opacity: originalsGone ? 0 : (demoing && !spotlight ? 0.25 : (stage === 3 ? 0.28 : 1)),
            duration: originalsGone ? 600 : 450, easing: originalsGone ? 'easeInBack' : 'easeOutBack',
            delay: originalsGone ? anime.stagger(10) : 0 });
        });

        // ---- the draws: one at stage 2, all of them from stage 3 ----
        synMin.forEach((d, i) => {
          const on = (stage === 2 && i === DEMO_DRAW) || stage >= 3;
          TM.anime({ targets: d, scale: on ? 1 : 0, opacity: on ? 1 : 0,
            duration: 450, easing: on ? 'easeOutBack' : 'easeInQuad',
            delay: stage === 3 ? anime.stagger(22) : 0 });
        });
        synMaj.forEach(d => {
          const on = stage >= 3;
          TM.anime({ targets: d, scale: on ? 1 : 0, opacity: on ? 1 : 0,
            duration: 450, easing: on ? 'easeOutBack' : 'easeInQuad',
            delay: on ? anime.stagger(22) : 0 });
        });

        setCount(counts[0], stage >= 4 ? SMAJ.length : MAJ.length);
        setCount(counts[1], stage >= 4 ? SMIN.length : MIN.length);

        setTitle(
          stage >= 5 ? 'A balanced sample, with both classes smoothed rather than copied'
          : stage === 4 ? 'The originals are not kept: the draws are the returned sample'
          : stage === 3 ? 'Repeat: bootstrap a point, draw from its kernel, for both classes'
          : stage === 2 ? 'A new point is drawn from the kernel, so it is near the original but not a copy'
          : stage === 1 ? 'ROSE puts a smoothing kernel around an observation'
          : 'Imbalanced: 30 majority points against 10 minority');
      }

      TM.gate({
        markerClass: 'rose-slide',
        fragmentIds: ['rose-kernel', 'rose-draw', 'rose-repeat', 'rose-replace', 'rose-balanced'],
        render,
      });
    })();
    </script>

          }
          setTimeout(function() {
            if (tooltip) {
              tooltip.hide();

              button.removeAttribute("data-bs-placement");

            arrow: false,
            appendTo: function(el) {
                return el.closest('section.slide') || el.parentElement;

          if (contentFn) {

          if (onTriggerFn) {
            config.onTrigger = onTriggerFn;
          }
          if (onUntriggerFn) {
            config.onUntrigger = onUntriggerFn;
          }
            config['offset'] = [0,0];

            const id = href.replace(/^#\/?/, "");
