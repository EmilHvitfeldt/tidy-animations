    <script>
    /* ---- tidy-animations shared infrastructure ----
     * Ported from the anime.js + RevealJS lessons. Kept deliberately small:
     * coordinate conversion, slide lookup, and a fragment/slide gating helper
     * that drives a single idempotent render(stage) per animation.
     */
    window.TM = window.TM || {};

    /* Register listeners as soon as Reveal exists — do NOT wait for 'ready',
     * because include-after-body scripts often load after Reveal initialises. */
    TM.onReveal = function (cb) {
      (function go() {
        if (typeof Reveal === 'undefined' || !Reveal.on) { setTimeout(go, 50); return; }
        cb();
      })();
    };

    /* ---- activity tracking (so a recorder can wait for "idle" instead of guessing
     * delays). Every animation goes through TM.anime; intentional pauses use
     * TM.busyInc/busyDec so they count as busy too. TM.idle() is true only when
     * nothing is animating and no pause is pending. */
    TM._busy = 0;
    TM.busyInc = function () { TM._busy++; };
    TM.busyDec = function () { TM._busy = Math.max(0, TM._busy - 1); };
    TM.idle = function () { return TM._busy === 0; };
    TM.anime = function (params) {
      TM.busyInc();
      const inst = anime(params);
      inst.finished.then(TM.busyDec, TM.busyDec);  // decrement when it settles (or errors)
      return inst;
    };
    /* a tracked timed gap: stays "busy" for `ms`, then runs fn. Increment the next
     * step before this decrements (do that inside fn) to avoid a momentary idle dip. */
    TM.pause = function (ms, fn) {
      TM.busyInc();
      setTimeout(function () { if (fn) fn(); TM.busyDec(); }, ms);
    };

    /* screen pixels -> slide internal coordinate units */
    TM.cssToSlide = function (px, section) {
      const w = section.getBoundingClientRect().width;
      return px * (Reveal.getConfig().width / w);
    };

    /* find the <section> carrying a marker class (querySelector won't match self) */
    TM.sectionFor = function (markerClass) {
      const el = document.querySelector('.' + markerClass);
      return el ? el.closest('section') : null;
    };

    /* Gate an animation behind a slide + ordered fragment ids.
     *   markerClass : class on the slide section
     *   fragmentIds : array of fragment element ids, in advancing order
     *   render(stage): called with the number of those fragments currently visible
     * Fires on fragmentshown/hidden and on slidechanged (forward, back, and
     * direct-link arrival all resolve to the same stage number). */
    TM.gate = function ({ markerClass, fragmentIds, render }) {
      function visibleStage() {
        let n = 0;
        for (const id of fragmentIds) {
          const f = document.getElementById(id);
          if (f && f.classList.contains('visible')) n++; else break;
        }
        return n;
      }
      function onThisSlide(slide) {
        return slide && (slide.classList.contains(markerClass) ||
                         slide.querySelector('.' + markerClass));
      }
      TM.onReveal(function () {
        Reveal.on('fragmentshown',  () => { if (onThisSlide(Reveal.getCurrentSlide())) render(visibleStage()); });
        Reveal.on('fragmenthidden', () => { if (onThisSlide(Reveal.getCurrentSlide())) render(visibleStage()); });
        Reveal.on('slidechanged', ({ currentSlide }) => {
          if (onThisSlide(currentSlide)) render(visibleStage());
        });
        // direct-link / reload arrival: render once Reveal can report the slide
        (function boot() {
          const cur = Reveal.getCurrentSlide && Reveal.getCurrentSlide();
          if (!cur) { setTimeout(boot, 60); return; }
          if (onThisSlide(cur)) render(visibleStage());
        })();
      });
    };
    </script>
    <script>
    /* ---- Instance hardness animation ----
     * Marker slide: .ih-slide   Stage container: #ih-stage
     * render(stage) is idempotent (stage = number of visible gating fragments).
     *
     * Worth being precise about, because the name suggests otherwise: themis does
     * NOT fit a model and threshold its predicted probabilities. It uses a kNN
     * proxy — hardness is the share of a point's k nearest neighbours whose label
     * disagrees with its own — then keeps the EASIEST points of the over-sized
     * class until the classes balance. See themis R/instance_hardness_impl.R:
     *   hardness <- rowMeans(disagree, na.rm = TRUE)
     *   selected_ind <- rank(hardness) <= n_keep
     *
     * Instructive to compare with the NearMiss deck: both score the majority and
     * cut, but they cut in opposite directions. NearMiss keeps the points nearest
     * the minority, so the survivors hug the boundary. Instance hardness keeps the
     * points its neighbourhood already agrees on, so the survivors retreat into
     * the majority interior.
     *
     * Segments (stage 0 = slide arrival):
     *   0 imbalanced, with the majority reaching into minority territory
     *   1 one majority point asks its k = 5 nearest neighbours
     *   2 all five disagree, so its hardness is 1.0
     *   3 score every majority point and shade it
     *   4 drop the hardest until the classes balance
     *   5 the easy interior is what survives
     */

      // [majority, minority, easy end of ramp, hard end of ramp]
      const COLORS = window.IH_COLORS || ['#c8ccd4', '#d6336c', '#eceef2', '#343a40'];
      const [C_MAJ, C_MIN, C_EASY, C_HARD] = COLORS;

      const K = 5;

      // Hardcoded layout and hardness scores, computed offline. The overlap is
      // tuned so all six possible hardness levels (0, .2, .4, .6, .8, 1) occur and
      // only one point sits exactly on the cut, so the selection does not come down
      // to tie-breaking.
      const MAJ = [
        [531, 264], [469, 352], [328, 176], [536, 218], [591, 253],
        [75, 85], [414, 241], [616, 154], [384, 372], [577, 130],
        [733, 190], [668, 240], [347, 96], [652, 496], [370, 204],
        [653, 339], [854, 351], [201, 278], [195, 400], [254, 422],
        [355, 472], [235, 244], [322, 128], [305, 406], [72, 477],
        [361, 323], [346, 405], [449, 322], [100, 228], [128, 430],
      ];
      const MIN = [
        [871, 208], [814, 145], [448, 256], [995, 272], [583, 179],
        [906, 304], [825, 481], [556, 331], [720, 394], [768, 217],
        [522, 481], [1003, 160], [718, 254], [752, 446], [462, 448],
        [649, 126], [635, 212], [895, 151], [894, 345], [645, 288],
      ];
      const HARD = [0.6, 0.6, 0.0, 0.4, 0.6, 0.0, 0.2, 0.6, 0.0, 0.6,
                    0.8, 0.6, 0.0, 0.8, 0.2, 0.6, 1.0, 0.0, 0.0, 0.0,

      const NBRS = [
        [3, 4, 37, 32, 34], [27, 8, 37, 44, 32], [22, 14, 12, 6, 21], [0, 34, 4, 32, 9],
        [46, 0, 49, 3, 34], [28, 21, 17, 22, 2], [32, 14, 27, 25, 2], [34, 45, 9, 46, 11],
        [26, 25, 27, 23, 1], [7, 34, 45, 3, 46], [39, 42, 11, 31, 46], [46, 42, 49, 4, 10],

        const [sx, sy] = p0, [dx, dy] = p1;
        const len = Math.max(Math.hypot(dx - sx, dy - sy) - 14, 4);
        const ang = Math.atan2(dy - sy, dx - sx) * 180 / Math.PI;

        el.style.background = color;

        const box = document.createElement('div');
        box.className = 'ih-legend';
        [['majority', C_MAJ, MAJ.length], ['minority', C_MIN, MIN.length]].forEach(

            row.className = 'ih-legend-item';
            const sw = document.createElement('span');
            sw.className = 'ih-swatch';
            sw.style.backgroundColor = color;

            txt.textContent = label + ' ';
            const num = document.createElement('span');
            num.className = 'ih-count';

        ramp = document.createElement('div');

          '<span class="ih-ramp-bar"></span>' +
          '<span class="ih-ramp-label">hard</span>';

          `linear-gradient(to right, ${C_EASY}, ${C_HARD})`;
        stageEl.appendChild(ramp);
        anime.set(ramp, { opacity: 0 });
      }

      function build() {
        const stageEl = document.getElementById('ih-stage');
        if (!stageEl || built) return !!stageEl;
        built = true;
        world = document.createElement('div');
        world.className = 'ih-world';
        stageEl.appendChild(world);

        MAJ.forEach(([x, y]) => majDots.push(makeDot(x, y, C_MAJ)));
        MIN.forEach(([x, y]) => minDots.push(makeDot(x, y, C_MIN)));

        ring = document.createElement('div');
        ring.className = 'ih-ring';
        world.appendChild(ring);
        anime.set(ring, { translateX: MAJ[DEMO][0], translateY: MAJ[DEMO][1], opacity: 0 });

        NBRS[DEMO].forEach(j => demoLines.push(makeLine(MAJ[DEMO], pt(j), isMaj(j) ? '#8a9099' : C_MIN)));

        const disagree = NBRS[DEMO].filter(j => !isMaj(j)).length;
        caption = document.createElement('div');
        caption.className = 'ih-caption';
        caption.textContent = `${disagree} of ${K} disagree, so hardness = ${(disagree / K).toFixed(1)}`;
        world.appendChild(caption);
        anime.set(caption, { translateX: MAJ[DEMO][0], translateY: MAJ[DEMO][1] + 52, opacity: 0 });

        buildChrome(stageEl);
        return true;
      }

      function setCount(el, value) {
        if (el.textContent === String(value)) return;
        el.textContent = value;
        TM.anime({ targets: el, scale: [1.35, 1], duration: 420, easing: 'easeOutBack' });
      }

      function setTitle(text) {
        const t = document.getElementById('ih-title');
        if (!t) return;
        t.textContent = text;
        TM.anime({ targets: t, opacity: text ? 1 : 0, duration: 400, easing: 'easeInOutQuad' });
      }

      function render(stage) {
        if (!build()) return;

        const asking = stage === 1 || stage === 2;

        TM.anime({ targets: ring, opacity: asking ? 1 : 0, scale: asking ? 1 : 0.6,
          duration: 350, easing: 'easeOutBack' });
        TM.anime({ targets: demoLines, opacity: asking ? 0.95 : 0, duration: 400,
          easing: 'easeInOutQuad', delay: asking ? anime.stagger(80) : 0 });
        TM.anime({ targets: caption, opacity: stage === 2 ? 1 : 0, duration: 380,
          easing: 'easeInOutQuad' });
        TM.anime({ targets: ramp, opacity: stage >= 3 && stage < 5 ? 1 : 0, duration: 380,
          easing: 'easeInOutQuad' });

        // ---- majority: shaded by hardness, then the hardest are dropped ----
        majDots.forEach((d, i) => {
          const gone = stage >= 4 && !KEPT_SET.has(i);
          // the ramp is scaffolding: it goes away again once the cut is made
          const shade = (stage >= 3 && stage < 5) || (stage === 2 && i === DEMO);
          const dim = asking && i !== DEMO;
          TM.anime({
            targets: d,
            backgroundColor: shade ? rampColor(HARD[i]) : C_MAJ,
            scale: gone ? 0 : (asking && i === DEMO ? 1.25 : 1),
            opacity: gone ? 0 : (dim ? 0.28 : 1),
            duration: gone ? 550 : 450,
            easing: gone ? 'easeInBack' : 'easeInOutQuad',
            delay: gone ? anime.stagger(30) : (stage === 3 ? anime.stagger(20) : 0),
          });
        });

        minDots.forEach((d, i) => {
          const isNbr = NBRS[DEMO].includes(MAJ.length + i);
          TM.anime({ targets: d, opacity: asking && !isNbr ? 0.28 : 1,
            scale: asking && isNbr ? 1.15 : 1,
            duration: 420, easing: 'easeOutBack' });
        });

        setCount(counts[0], stage >= 4 ? KEPT.length : MAJ.length);
        setCount(counts[1], MIN.length);

        setTitle(
          stage >= 5 ? 'What survives is the majority its own neighbourhood already agrees on'
          : stage === 4 ? 'Drop the hardest points until the classes balance'
          : stage === 3 ? 'Score every majority point the same way'
          : stage === 2 ? 'All five neighbours disagree, so this point is as hard as it gets'
          : stage === 1 ? 'Hardness = the share of a point’s k = 5 neighbours that disagree with its label'
          : 'Imbalanced, with the majority reaching into minority territory');
      }

      TM.gate({
        markerClass: 'ih-slide',
        fragmentIds: ['ih-ask', 'ih-score', 'ih-scoreall', 'ih-drop', 'ih-balanced'],
        render,
      });
    })();
    </script>
