    /* ---- tidy-animations shared infrastructure ----
     * Ported from the anime.js + RevealJS lessons. Kept deliberately small:
     * coordinate conversion, slide lookup, and a fragment/slide gating helper
     * that drives a single idempotent render(stage) per animation.
     */
    window.TM = window.TM || {};

    /* Register listeners as soon as Reveal exists — do NOT wait for 'ready',
     * because include-after-body scripts often load after Reveal initialises. */
    TM.onReveal = function (cb) {
      (function go() {
        if (typeof Reveal === 'undefined' || !Reveal.on) { setTimeout(go, 50); return; }
        cb();
      })();
    };

    /* ---- activity tracking (so a recorder can wait for "idle" instead of guessing
     * delays). Every animation goes through TM.anime; intentional pauses use
     * TM.busyInc/busyDec so they count as busy too. TM.idle() is true only when
     * nothing is animating and no pause is pending. */
    TM._busy = 0;
    TM.busyInc = function () { TM._busy++; };
    TM.busyDec = function () { TM._busy = Math.max(0, TM._busy - 1); };
    TM.idle = function () { return TM._busy === 0; };
    TM.anime = function (params) {
      TM.busyInc();
      const inst = anime(params);
      inst.finished.then(TM.busyDec, TM.busyDec);  // decrement when it settles (or errors)
      return inst;
    };
    /* a tracked timed gap: stays "busy" for `ms`, then runs fn. Increment the next
     * step before this decrements (do that inside fn) to avoid a momentary idle dip. */
    TM.pause = function (ms, fn) {
      TM.busyInc();
      setTimeout(function () { if (fn) fn(); TM.busyDec(); }, ms);
    };

    /* screen pixels -> slide internal coordinate units */
    TM.cssToSlide = function (px, section) {
      const w = section.getBoundingClientRect().width;
      return px * (Reveal.getConfig().width / w);
    };

    /* find the <section> carrying a marker class (querySelector won't match self) */
    TM.sectionFor = function (markerClass) {
      const el = document.querySelector('.' + markerClass);
      return el ? el.closest('section') : null;
    };

    /* Gate an animation behind a slide + ordered fragment ids.
     *   markerClass : class on the slide section
     *   fragmentIds : array of fragment element ids, in advancing order
     *   render(stage): called with the number of those fragments currently visible
     * Fires on fragmentshown/hidden and on slidechanged (forward, back, and
     * direct-link arrival all resolve to the same stage number). */
    TM.gate = function ({ markerClass, fragmentIds, render }) {
      function visibleStage() {
        let n = 0;
        for (const id of fragmentIds) {
          const f = document.getElementById(id);
          if (f && f.classList.contains('visible')) n++; else break;
        }
        return n;
      }
      function onThisSlide(slide) {
        return slide && (slide.classList.contains(markerClass) ||
                         slide.querySelector('.' + markerClass));
      }
      TM.onReveal(function () {
        Reveal.on('fragmentshown',  () => { if (onThisSlide(Reveal.getCurrentSlide())) render(visibleStage()); });
        Reveal.on('fragmenthidden', () => { if (onThisSlide(Reveal.getCurrentSlide())) render(visibleStage()); });

          if (onThisSlide(currentSlide)) render(visibleStage());
        });

        (function boot() {
          const cur = Reveal.getCurrentSlide && Reveal.getCurrentSlide();
          if (!cur) { setTimeout(boot, 60); return; }
          if (onThisSlide(cur)) render(visibleStage());
        })();
      });
    };

    /* ---- Orbital: flat -> nested case_when ----

     * render(stage) is idempotent (stage = number of visible gating fragments).
     *
     * Left: the flat case_when() orbital used to generate (re-checks `x <= 5`).
     * Right: a copy that morphs into the nested, tree-shaped case_when().
     *
     *   stage 0  arrival: flat block on the left
     *   stage 1  spotlight the two redundant `x <= 5` conditions
     *   stage 2  copy the flat block over to the right slot
     *   stage 3  wrap: an empty outer `x <= 5 ~ case_when( )` shell drops in above
     *            the arms (which stay as siblings below it); outer check goes green
     *   stage 4  nest: the two matching arms rise up into that empty shell and
     *            indent; their now-redundant `x <= 5 &` prefixes go red

     * function slot -> { row, indent, html }: a logical line keeps its element
     * across the morph, so a slot's `indent` (in character widths) is driven by
     * translateX — indenting the arms therefore *slides* them inward rather than
     * jumping, which is what reads as the "move the lines inside" motion.

      const LINEH = 34;
      const LEFT_X = 150, LEFT_Y0 = 200;
      const RIGHT_X = 690, RIGHT_Y0 = 183;   // nested is 7 lines, nudged up to centre

      const fn   = (s) => `<span class="ocw-fn">${s}</span>`;
      const val  = (s) => `<span class="ocw-val">${s}</span>`;
      const def  = ()  => `<span class="ocw-def">.default</span>`;
      const cond = (s) => `<span class="ocw-cond">${s}</span>`;
      const pre  = ()  => `<span class="ocw-pre">${cond('x <= 5')} & </span>`;

      // the flat block on the left, one entry per line (indentation via spaces here;
      // the left block never animates its indentation)
      const FLAT = [
        { html: `${fn('case_when')}(` },
        { html: `  ${cond('x <= 5')} & y <= 3 ~ ${val('"low"')},` },
        { html: `  ${cond('x <= 5')} & y > 3  ~ ${val('"med"')},` },
        { html: `  x > 5           ~ ${val('"high"')}` },
        { html: `)` },
      ];

      // right-hand slots, in DOM/pool order
      const SLOTS = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];

      // flat copy of the right block (stage 2): 5 lines, slots F/G unused
      const FLAT_RIGHT = {
        A: { row: 0, indent: 0, html: `${fn('case_when')}(` },
        B: { row: 1, indent: 2, html: `x <= 5 & y <= 3 ~ ${val('"low"')},` },
        C: { row: 2, indent: 2, html: `x <= 5 & y > 3  ~ ${val('"med"')},` },
        D: { row: 3, indent: 2, html: `x > 5           ~ ${val('"high"')}` },
        E: { row: 4, indent: 0, html: `)` },

      // removes the redundant prefixes; `d` collapses trailing arms to `.default`.

      // right under the open before the arms move in, and drops below them after.
      function nested({ moved, strip, d }) {

        const p = strip ? '' : pre();

          F: { row: rows.F, indent: 2, html: `${cond('x <= 5')} ~ ${fn('case_when')}(` },
          B: { row: rows.B, indent: arm, html: `${p}y <= 3 ~ ${val('"low"')},` },
          C: { row: rows.C, indent: arm, html: d ? `${def()} = ${val('"med"')}`
                                                 : `${p}y > 3  ~ ${val('"med"')}${cComma}` },

          D: { row: rows.D, indent: 2, html: d ? `${def()} = ${val('"high"')}`

        const flyIn = stage === 2 && prevStage < 2;   // first arrival of the copy
        const forward = stage > prevStage;
        // did any already-visible line move rows this step? (e.g. the wrap step
        // pushes the arms down). If so, newly-shown lines wait for that to settle.
        let linesMoving = false;
        SLOTS.forEach((name) => {
          const spec = layout ? layout[name] : null;
          if (spec && right[name].visible && right[name].rowIdx !== spec.row) linesMoving = true;
        });
        const MOVE_MS = 520;

        SLOTS.forEach((name) => {
          const slot = right[name];
          const spec = layout ? layout[name] : null;
          if (!spec) {                       // slot not used at this stage: hide it
            slot.visible = false;
            slot.rowIdx = -1;
            TM.anime({ targets: slot.el, opacity: 0, duration: 250, easing: 'easeOutQuad' });
            return;
          }
          const x = RIGHT_X + spec.indent * CH;
          const y = RIGHT_Y0 + spec.row * LINEH;
          const wasVisible = slot.visible;
          const sameRow = slot.rowIdx === spec.row;
          const textChanged = stripTags(spec.html) !== slot.text;
          if (spec.html !== slot.html) { slot.el.innerHTML = spec.html; slot.html = spec.html; }
          slot.text = stripTags(spec.html);
          slot.rowIdx = spec.row;
          slot.visible = true;

          if (flyIn) {                       // copy flies over from the left block
            anime.set(slot.el, { translateX: LEFT_X, translateY: y, opacity: 0 });
            TM.anime({ targets: slot.el, translateX: x, opacity: [0, 1],
                       duration: 620, easing: 'easeInOutCubic' });
          } else if (!wasVisible) {           // a newly shown line: fade in, in place,
            // after the moving lines settle (so the shell appears once room is made)
            anime.set(slot.el, { translateX: x, translateY: y, opacity: 0 });
            TM.anime({ targets: slot.el, opacity: [0, 1], duration: 380,
                       delay: (forward && linesMoving) ? MOVE_MS - 120 : 0,
                       easing: 'easeOutQuad' });
          } else {
            // an in-place text edit (same row) crossfades so it reads as a
            // transform; a line that only changes rows just slides (no opacity dip,
            // which is what used to make the arms flicker when the shell appeared).
            const fade = textChanged && sameRow && forward;
            TM.anime({ targets: slot.el, translateX: x, translateY: y,
                       opacity: fade ? [0.15, 1] : 1, duration: fade ? 460 : MOVE_MS,
                       easing: 'easeInOutCubic' });
          }
        });
      }

      function render(stage) {
        if (!build()) return;

        // spotlight the two redundant `x <= 5` conditions on the left
        const hot = stage >= 1 && stage <= 2;
        leftCondEls.forEach((el) => el.classList.toggle('ocw-hot', hot));

        renderRight(stage);

        // once the outer wrapper exists (stage >= 3) the outer `x <= 5` is the
        // single canonical check — mark it green.
        const outer = right.F && right.F.el.querySelector('.ocw-cond');
        if (outer) outer.classList.toggle('ocw-ok', stage >= 3);
        // stage 4 (nest): the inner prefix copies are now redundant — flag them red.
        ['B', 'C'].forEach((n) => {
          const c = right[n] && right[n].el.querySelector('.ocw-pre .ocw-cond');
          if (c) c.classList.toggle('ocw-hot', stage === 4);
        });

        if (titleEl) {
          titleEl.textContent = TITLES[Math.min(stage, 7)];
          titleEl.style.opacity = 1;
        }

        prevStage = stage;
      }

      TM.gate({
        markerClass: 'ocw-slide',
        fragmentIds: ['ocw-redundant', 'ocw-copy', 'ocw-wrap', 'ocw-nest',
                      'ocw-strip', 'ocw-default', 'ocw-done'],
        render,
      });
    })();
    </script>
